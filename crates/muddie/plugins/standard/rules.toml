# The vitals many MUDs report the same way: over GMCP in Char.Vitals,
# under the names most use, and over MSDP. Only those the MUD sends are
# shown; each turns yellow under 60 % and red under 30 %.

[[gauge]]
name = "HP"
folder = "GMCP"
value = "Char.Vitals.hp"
max = "Char.Vitals.maxhp"
colour = "#5fb85f"
kind = "bar"
steps = [{ under = 60, colour = "#e0c040" }, { under = 30, colour = "#e05050" }]

