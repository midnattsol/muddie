[package]
name = "muddie"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A modern, accessible MUD client."

[dependencies]
# Drawn with OpenGL: the Vulkan path of the default renderer loads every
# graphics driver the system has, some eighty megabytes of them.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "web_screen_reader",
    "x11",
] }
fontdb = "0.24.0"
jiff = "1.0.1"
keyring = "4.2.0"
muddie-core = { version = "0.1.0", path = "../muddie-core" }
muddie-mapper = { version = "0.1.0", path = "../muddie-mapper" }
muddie-script = { version = "0.1.0", path = "../muddie-script" }
muddie-sound = { version = "0.1.0", path = "../muddie-sound" }
muddie-speech = { version = "0.1.0", path = "../muddie-speech" }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
toml = "1.2.1"
ureq = "3.5.2"
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-csd-adwaita",
    "wayland-dlopen",
    "x11",
] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }

# The Debian package: `cargo deb -p muddie`, as the CI does for a release.
[package.metadata.deb]
name = "muddie"
maintainer = "Muddie developers"
copyright = "Muddie developers"
section = "games"
priority = "optional"
extended-description = """\
Muddie is a MUD client made to be heard as well as seen: every line is read \
by the screen reader in use, and so reaches a braille display, or by the \
system's voice. Scriptable in Luau, with triggers, aliases, keys, gauges, \
an automapper, GMCP, MSDP, MXP and TLS."""
depends = "$auto"
recommends = "speech-dispatcher"
assets = [
    ["target/release/muddie", "usr/bin/", "755"],
    ["../../assets/io.github.midnattsol.Muddie.desktop", "usr/share/applications/", "644"],
    ["../../assets/io.github.midnattsol.Muddie.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../assets/icons/hicolor/16x16/apps/io.github.midnattsol.Muddie.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../assets/icons/hicolor/24x24/apps/io.github.midnattsol.Muddie.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../assets/icons/hicolor/32x32/apps/io.github.midnattsol.Muddie.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../assets/icons/hicolor/48x48/apps/io.github.midnattsol.Muddie.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../assets/icons/hicolor/64x64/apps/io.github.midnattsol.Muddie.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../assets/icons/hicolor/128x128/apps/io.github.midnattsol.Muddie.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../assets/icons/hicolor/256x256/apps/io.github.midnattsol.Muddie.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../assets/icons/hicolor/512x512/apps/io.github.midnattsol.Muddie.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["../../README.md", "usr/share/doc/muddie/", "644"],
    ["../../docs/manual.md", "usr/share/doc/muddie/", "644"],
]
