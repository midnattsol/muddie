[package]
name = "muddie-core"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless core of the muddie MUD client: telnet, ANSI, session."

[dependencies]
encoding_rs = "0.8.44"
flate2 = "1.1.11"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "rt", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"

[dev-dependencies]
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
