[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
# Built and released as one program, never published to a registry.
publish = false

# A function does one thing: see clippy.toml for how long it may be.
[workspace.lints.clippy]
too_many_lines = "warn"

# Small, fast binaries for releases.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Text layout and drawing are far too slow unoptimised to judge the
# interface by, so even development builds optimise them.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
