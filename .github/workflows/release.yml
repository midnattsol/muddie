name: Release

# release-plz (release-plz.toml) keeps one release PR with the next
# version and the changelog, brought up to date when CI passes on main.
# Once it is merged, its commit, which changes only versions and the
# changelog of what CI passed, is not tried again: it is tagged and its
# release drafted, then built, packaged, tried and published.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The commit CI passed for, or the release's, not whatever main is by now.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  release-plz:
    # After CI passed for a change on main, or as a release is merged.
    if: >-
      github.repository_owner == 'midnattsol'
      && ((github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)'))
        || (github.event_name == 'push'
          && startsWith(github.event.head_commit.message, 'chore(release)')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.released.outputs.tag }}
      version: ${{ steps.released.outputs.version }}
    steps:
      # On main, as release-plz works on a branch.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # If main moved on past the commit CI passed for, the newer commit's
      # CI runs this again: nothing is done here.
      - id: current
        run: |
          if [ "$(git rev-parse HEAD)" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved on past $SHA: its own run will do this."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.current == 'true'
        uses: dtolnay/rust-toolchain@stable
      # The release PR merged: the tag, and the release as a draft.
      - id: release
        if: steps.current.outputs.current == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: released
        if: steps.current.outputs.current == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag=$(jq -r '.[]? | select(.package_name == "muddie") | .tag' <<< "${RELEASES:-[]}")
          version=$(jq -r '.[]? | select(.package_name == "muddie") | .version' <<< "${RELEASES:-[]}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Otherwise the release PR, brought up to date.
      - if: steps.current.outputs.current == 'true' && steps.released.outputs.tag == ''
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Built and packaged on each system. For Linux, built on an older system
  # than the runner's, as manylinux does: a program needs the C library it
  # was built against or a newer one, so built on Debian 12 it runs on it
  # and on every system since, Ubuntu 24.04 among them.
  build:
    needs: release-plz
    if: needs.release-plz.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: debian:12
            name: linux-x86_64
            binary: muddie
          - os: windows-latest
            name: windows-x86_64
            binary: muddie.exe
          - os: macos-latest
            name: macos-aarch64
            binary: muddie
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release-plz.outputs.version }}
    steps:
      # The container has nothing: what building and fetching Rust need.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          apt-get update
          apt-get install -y build-essential ca-certificates cmake curl git pkg-config libdbus-1-dev libspeechd-dev
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-plz.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p muddie
      # What to unpack and run as it is, on every system.
      - name: Archive
        shell: bash
        run: |
          mkdir -p dist muddie-${{ matrix.name }}
          cp target/release/${{ matrix.binary }} README.md README.es.md LICENSE-MIT LICENSE-APACHE muddie-${{ matrix.name }}/
          cp -r docs examples muddie-${{ matrix.name }}/
          # On Linux, what install.sh puts in the menu: ./install.sh --no-build
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mkdir -p muddie-${{ matrix.name }}/target/release
            mv muddie-${{ matrix.name }}/muddie muddie-${{ matrix.name }}/target/release/
            cp install.sh uninstall.sh muddie-${{ matrix.name }}/
            cp -r assets muddie-${{ matrix.name }}/
          fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a dist/muddie-${{ matrix.name }}.zip muddie-${{ matrix.name }}
          else
            tar czf dist/muddie-${{ matrix.name }}.tar.gz muddie-${{ matrix.name }}
          fi
      # What installs it as programs are installed on each system.
      - name: Debian package
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p muddie --no-build --output dist/
      - name: Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\muddie.iss
      - name: macOS disk image
        if: matrix.os == 'macos-latest'
        run: packaging/macos/make-dmg.sh "$VERSION" dist/muddie-${{ matrix.name }}.dmg
      # A signed statement that these files were built here, from this
      # commit: `gh attestation verify FILE -R midnattsol/muddie`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: muddie-${{ matrix.name }}
          path: dist/*

  # Each installer installs, and what it installs starts and has the
  # screen readers of its system built in.
  debian-package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "ubuntu:24.04"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: muddie-linux-x86_64
      - run: |
          apt-get update
          apt-get install -y ./muddie_*.deb
          muddie --version | tee version.txt
          grep -q Orca version.txt

  installers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: muddie-windows-x86_64
            speech: NVDA
          - os: macos-latest
            artifact: muddie-macos-aarch64
            speech: VoiceOver
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
      - name: Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $setup = Get-ChildItem muddie-*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Muddie\muddie.exe'
          if (-not (Test-Path $exe)) { throw "not installed in $exe" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          if (-not (Get-ChildItem $menu -Recurse -Filter 'Muddie.lnk')) { throw 'not in the Start menu' }
          & $exe --version | Out-File -Encoding utf8 version.txt
          Get-Content version.txt
      - name: macOS disk image
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil attach muddie-*.dmg -mountpoint /Volumes/Muddie -nobrowse
          cp -R /Volumes/Muddie/Muddie.app "$RUNNER_TEMP/"
          hdiutil detach /Volumes/Muddie
          codesign --verify --deep "$RUNNER_TEMP/Muddie.app"
          "$RUNNER_TEMP/Muddie.app/Contents/MacOS/muddie" --version | tee version.txt
      - name: The screen readers of the system are built in
        shell: bash
        run: grep -q "${{ matrix.speech }}" version.txt

  # The files on the draft, with what each adds up to, and the draft
  # published.
  publish:
    needs: [release-plz, build, debian-package, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-plz.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: muddie-*
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum muddie* > SHA256SUMS
          ls -l
      - run: gh release upload "$TAG" dist/* --clobber
      - run: gh release edit "$TAG" --draft=false --latest
