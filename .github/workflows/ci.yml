name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints and every test, on each system: what is different
  # on each (paths, speech, keys) is tried where it runs.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Without these the screen reader and the system's voice are left
      # out of the build, and a test says so.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libspeechd-dev pkg-config
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Known vulnerabilities, and licences that let Muddie be shared as it is.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Built and packaged only once the tests and the dependencies pass: what
  # would be built of code that fails is of no use. For Linux, built on
  # an older system than the runner's, as manylinux does: a program needs
  # the C library it was built against or a newer one, so built on Debian 12
  # it runs on it and on every system since, Ubuntu 24.04 among them.
  build:
    needs: [test, dependencies]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: debian:12
            name: linux-x86_64
            binary: muddie
          - os: windows-latest
            name: windows-x86_64
            binary: muddie.exe
          - os: macos-latest
            name: macos-aarch64
            binary: muddie
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # The container has nothing: what building and fetching Rust need.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          apt-get update
          apt-get install -y build-essential ca-certificates curl git pkg-config libdbus-1-dev libspeechd-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p muddie
      # What to unpack and run as it is, on every system.
      - name: Archive
        shell: bash
        run: |
          mkdir -p dist muddie-${{ matrix.name }}
          cp target/release/${{ matrix.binary }} README.md README.es.md LICENSE-MIT LICENSE-APACHE muddie-${{ matrix.name }}/
          cp -r docs examples muddie-${{ matrix.name }}/
          # On Linux, what install.sh puts in the menu: ./install.sh --no-build
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mkdir -p muddie-${{ matrix.name }}/target/release
            mv muddie-${{ matrix.name }}/muddie muddie-${{ matrix.name }}/target/release/
            cp install.sh uninstall.sh muddie-${{ matrix.name }}/
            cp -r assets muddie-${{ matrix.name }}/
          fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a dist/muddie-${{ matrix.name }}.zip muddie-${{ matrix.name }}
          else
            tar czf dist/muddie-${{ matrix.name }}.tar.gz muddie-${{ matrix.name }}
          fi
      # What installs it as programs are installed on each system.
      - name: Debian package
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p muddie --no-build --output dist/
      - name: Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\muddie.iss
      - name: macOS disk image
        if: matrix.os == 'macos-latest'
        run: packaging/macos/make-dmg.sh "${{ steps.version.outputs.version }}" dist/muddie-${{ matrix.name }}.dmg
      # A signed statement that these files were built here, from this
      # commit: `gh attestation verify FILE -R midnattsol/muddie`. Made for
      # every push to main, as a release publishes the files built then.
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: muddie-${{ matrix.name }}
          path: dist/*

  # Each installer installs, and what it installs starts and has the
  # screen readers of its system built in.
  debian-package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "ubuntu:24.04"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muddie-linux-x86_64
      - run: |
          apt-get update
          apt-get install -y ./muddie_*.deb
          muddie --version | tee version.txt
          grep -q Orca version.txt

  installers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: muddie-windows-x86_64
            speech: NVDA
          - os: macos-latest
            artifact: muddie-macos-aarch64
            speech: VoiceOver
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
      - name: Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $setup = Get-ChildItem muddie-*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Muddie\muddie.exe'
          if (-not (Test-Path $exe)) { throw "not installed in $exe" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          if (-not (Get-ChildItem $menu -Recurse -Filter 'Muddie.lnk')) { throw 'not in the Start menu' }
          & $exe --version | Out-File -Encoding utf8 version.txt
          Get-Content version.txt
      - name: macOS disk image
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil attach muddie-*.dmg -mountpoint /Volumes/Muddie -nobrowse
          cp -R /Volumes/Muddie/Muddie.app "$RUNNER_TEMP/"
          hdiutil detach /Volumes/Muddie
          codesign --verify --deep "$RUNNER_TEMP/Muddie.app"
          "$RUNNER_TEMP/Muddie.app/Contents/MacOS/muddie" --version | tee version.txt
      - name: The screen readers of the system are built in
        shell: bash
        run: grep -q "${{ matrix.speech }}" version.txt
