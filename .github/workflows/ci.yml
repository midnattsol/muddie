name: CI

# Formatting, lints, the tests on each system and the dependencies, when
# something they check changes: a change to the manual or the README runs
# none of it. When it passes on main, release.yml runs.
on:
  push:
    branches: [main]
    paths: &checked
      - 'crates/**'
      - 'examples/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.github/workflows/**'
  pull_request:
    paths: *checked
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # What is different on each system (paths, speech, keys) is tried where
  # it runs.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Without these the screen reader and the system's voice are left
      # out of the build, and a test says so.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libspeechd-dev pkg-config
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Known vulnerabilities, and licences that let Muddie be shared as it is.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
